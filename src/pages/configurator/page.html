<main id="main" class="container">
  <div class="cfg-title">
    <h1>风管选型配置器</h1>
    <p>选好产品系列、截面尺寸、板厚和外表面颜色，左侧的风管会立即按比例重画。可以拖动旋转查看，配置清单可复制后发给我们报价。</p>
  </div>

  <div class="cfg">
    <div class="stage-wrap">
      <div class="stage">
        <canvas id="cv" tabindex="0" role="img" aria-label="风管三维预览，可拖动或用方向键旋转"></canvas>
        <div class="stage-tools" role="group" aria-label="视图">
          <button class="chip" data-view="iso">等轴</button>
          <button class="chip" data-view="end">端面</button>
          <button class="chip" data-view="side">侧面</button>
          <button class="chip" id="tDims" aria-pressed="true">尺寸标注</button>
          <button class="chip" id="tFl" aria-pressed="true">法兰</button>
        </div>
        <div class="stage-hint">拖动旋转</div>
        <div class="titleblock">
          <div><small>当前配置</small><b id="tbName"></b></div>
          <div><small>内净尺寸 W×H×L（mm）</small><span class="num" id="tbSize"></span></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <section class="group">
        <h2>产品系列</h2>
        <div class="lines" id="lines" role="radiogroup" aria-label="产品系列"></div>
      </section>
      <section class="group">
        <h2>尺寸<span>按内净尺寸，单位 mm</span></h2>
        <div class="dim"><label for="nW">宽 W</label><input type="range" id="rW" min="200" max="3000" step="10" aria-label="宽度滑块"><div class="box"><input type="number" id="nW" min="200" max="3000" step="10" inputmode="numeric"><span>mm</span></div></div>
        <div class="dim"><label for="nH">高 H</label><input type="range" id="rH" min="150" max="2000" step="10" aria-label="高度滑块"><div class="box"><input type="number" id="nH" min="150" max="2000" step="10" inputmode="numeric"><span>mm</span></div></div>
        <div class="dim"><label for="nL">长 L</label><input type="range" id="rL" min="500" max="4000" step="50" aria-label="长度滑块"><div class="box"><input type="number" id="nL" min="500" max="4000" step="50" inputmode="numeric"><span>mm</span></div></div>
        <div class="warn" id="warn" hidden></div>
      </section>
      <section class="group">
        <h2 id="varTitle">板厚</h2>
        <div class="seg" id="variants" role="radiogroup" aria-labelledby="varTitle"></div>
        <p class="note" id="varNote"></p>
      </section>
      <section class="group" id="colorGroup">
        <h2>外表面颜色<span>彩钢板</span></h2>
        <div class="sw" id="colors" role="radiogroup" aria-label="外表面颜色"></div>
        <p class="note">屏幕颜色仅作示意，实际以彩钢板色卡和样板为准。</p>
      </section>
      <section class="group">
        <h2>设计风速<span>用于估算风量</span></h2>
        <div class="dim"><label for="nV">风速</label><input type="range" id="rV" min="2" max="20" step="0.5" aria-label="风速滑块"><div class="box"><input type="number" id="nV" min="2" max="20" step="0.5" inputmode="decimal"><span>m/s</span></div></div>
      </section>
      <section class="group">
        <h2>配置清单</h2>
        <table class="sheet"><tbody id="sheet"></tbody></table>
        <div class="actions">
          <button class="btn btn-primary" id="dlXlsx">下载 Excel 清单</button>
          <button class="btn btn-primary" id="dlDocx">下载 Word 清单</button>
          <button class="btn btn-line" id="copy">复制配置清单</button>
          <a class="btn btn-line" href="tel:{{site.tel}}">电话询价</a>
        </div>
        <p class="note">清单中的性能数据取自各系列产品技术参数表；板厚、颜色为常用选项，最终规格以技术确认和合同为准。</p>
      </section>
    </div>
  </div>
</main>
