<section class="sec" id="products">
  <div class="container">
    <div class="sec-head">
      <h2 class="h-sec">产品系列</h2>
      <p class="lede">保温送风、洁净工程、消声、排烟、耐火，每一类工况都有对应的板材和成品风管。点开一个系列查看参数，或直接带入配置器。</p>
    </div>
    <div class="prod">
      <div class="prod-tabs" role="tablist" aria-label="产品系列" id="prodTabs">
{{#each products}}        <button role="tab" id="t-{{id}}" aria-controls="p-{{id}}" aria-selected="{{selected}}"{{#if rest}} tabindex="-1"{{/if}}>{{tab}}<em>{{badge}}</em></button>
{{/each}}
      </div>

      <div>
{{#each products}}        <article class="prod-panel" role="tabpanel" id="p-{{id}}" aria-labelledby="t-{{id}}"{{#if rest}} hidden{{/if}}>
          <figure><img src="{{img}}" alt="{{alt}}" loading="lazy"></figure>
          <div class="prod-body">
            <h3>{{title}}</h3>
            <p>{{desc}}</p>
            <dl class="spec">
{{#each specs}}              <div><dt>{{label}}</dt><dd>{{value}}</dd></div>
{{/each}}            </dl>
            <div class="prod-actions">{{#each actions}}<a class="btn {{style}}" href="{{href}}">{{label}}</a>{{/each}}</div>
          </div>
        </article>
{{/each}}
      </div>
    </div>
  </div>
</section>
